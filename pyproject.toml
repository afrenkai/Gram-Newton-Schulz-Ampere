[project]
name = "gram-newton-schulz-ampere"
version = "0.1.0"
description = "Ampere Gram Newton-Schulz kernels with distributed Muon and Dion3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.22.9",
    "einops>=0.8.2",
    "jaxtyping>=0.3.11",
    "torch>=2.5",
    "triton>=3.1; sys_platform == 'linux'",
]

[project.optional-dependencies]
cutlass = ["flashinfer-python==0.6.13; sys_platform == 'linux'"]

[project.urls]
Repository = "https://github.com/afrenkai/Gram-Newton-Schulz-Ampere"
Issues = "https://github.com/afrenkai/Gram-Newton-Schulz-Ampere/issues"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "numpy>=2.4.4",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gram_newton_schulz_ampere*"]

[tool.setuptools.package-data]
gram_newton_schulz_ampere = ["kernels/*.cu"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
