[project]
name = "gram-newton-schulz-ampere"
version = "0.1.0"
description = "Ampere-compatible Triton kernels for Gram Newton-Schulz"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "triton; sys_platform == 'linux'",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "numpy>=2.4.4",
]

[tool.setuptools]
py-modules = ["newton_schulz", "triton_ns"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gram_newton_schulz_ampere*"]
